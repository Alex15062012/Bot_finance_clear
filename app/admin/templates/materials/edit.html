{% extends "base.html" %}
{% block content %}
<p><a href="/admin/materials">← К списку</a></p>
<h1>{{ material.title }}</h1>

<p class="row-actions" style="margin-bottom:1.2rem">
  <a class="btn-secondary" href="/admin/materials/{{ material.id }}/export.pdf">Скачать PDF</a>
  <a class="btn-secondary" href="/admin/materials/{{ material.id }}/export.docx">Скачать Word</a>
</p>

<form method="post" action="/admin/materials/{{ material.id }}" class="stack">
  <label>Название
    <input type="text" name="title" value="{{ material.title }}" required>
  </label>
  <label>Описание
    <textarea name="description" rows="3">{{ material.description or '' }}</textarea>
  </label>
  <label>Тип
    <select name="content_type">
      {% for t in types %}
        <option value="{{ t.value }}" {% if material.content_type == t.value %}selected{% endif %}>{{ t.value }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Контент / текст
    <textarea name="content" rows="6">{{ material.content or '' }}</textarea>
  </label>
  <label>URL
    <input type="text" name="url" value="{{ material.url or '' }}">
  </label>
  <label>Порядок
    <input type="number" name="sort_order" value="{{ material.sort_order }}">
  </label>
  <label class="checkbox">
    <input type="checkbox" name="is_active" {% if material.is_active %}checked{% endif %}>
    Активен
  </label>
  <button type="submit">Сохранить</button>
</form>
{% endblock %}
